name: Verify starter API
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ConnectionStrings__AuctionDatabase: Server=127.0.0.1;Port=3306;Database=simple_auctions;User ID=root;Password=local-ci-only;
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated database
        run: mysql -h 127.0.0.1 -u root -plocal-ci-only < Database/script.sql
      - name: Build
        run: dotnet build SimpleAuctions.csproj --configuration Release
      - name: Test bid rules
        run: dotnet test Tests/SimpleAuctions.Tests.csproj --configuration Release
      - name: Test API with MySQL
        shell: bash
        run: |
          dotnet run --project SimpleAuctions.csproj --configuration Release --no-build --no-launch-profile --urls http://localhost:5000 > /tmp/auction-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/auction-api.log' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:5000/ > /dev/null; then break; fi
            sleep 1
          done
          python3 Tests/smoke.py
